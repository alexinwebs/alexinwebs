name: Refresh ASCII Card

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3am UTC
  workflow_dispatch: {}

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest cards
        run: |
          curl -fL "https://gh.crafter.run/alexinwebs?theme=dark" -o dark_mode.svg
          curl -fL "https://gh.crafter.run/alexinwebs?theme=light" -o light_mode.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: refresh ASCII profile card"
          git push
